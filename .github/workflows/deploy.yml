name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true

      - name: Build and push Vote image
        uses: docker/build-push-action@v4
        with:
          context: ./vote
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app-vote:latest
            ${{ secrets.DOCKER_USERNAME }}/voting-app-vote:${{ github.sha }}

      - name: Build and push Result image
        uses: docker/build-push-action@v4
        with:
          context: ./result
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app-result:latest
            ${{ secrets.DOCKER_USERNAME }}/voting-app-result:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app-worker:latest
            ${{ secrets.DOCKER_USERNAME }}/voting-app-worker:${{ github.sha }}